site_name: Woodpecker for Mere Mortals
site_description: A self hosted continuous integration system in three small programs. Checking a pipeline file and running it locally with the command line tool, booting the server with its SQLite database, registering an agent in local mode without containers, and understanding forges, webhooks and backends, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/woodpecker-for-mere-mortals/
